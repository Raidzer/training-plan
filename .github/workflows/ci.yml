name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-main' || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test:coverage

      - name: Create Coverage Summary
        if: always()
        run: node src/scripts/writeCoverageSummary.mjs

      - name: Publish Coverage Summary
        if: ${{ always() && hashFiles('coverage/coverage-summary.md') != '' }}
        run: cat coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Report
        if: ${{ always() && hashFiles('coverage/cobertura-coverage.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          fail-on-error: false

      - name: Upload Coverage HTML
        if: ${{ always() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage
          retention-days: 14

      - name: Comment Coverage Summary
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage/coverage-summary.md') != '' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- coverage-summary -->";
            const body = `${marker}\n${fs.readFileSync("coverage/coverage-summary.md", "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const previousComment = comments.find((comment) => {
              return comment.user?.type === "Bot" && (comment.body || "").includes(marker);
            });

            try {
              if (previousComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: previousComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Unable to publish coverage PR comment: ${error.message}`);
            }

  build:
    name: Build Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgres://mock_user:mock_pass@localhost:5432/mock_db"
          auth_secret: "mock_secret"
          NEXTAUTH_URL: "http://localhost:3000"

  release-context:
    name: Validate release
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.context.outputs.release }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/github-script@v8
        id: context
        with:
          script: |
            const fs = require("node:fs");
            const { getReleaseContext } = await import(`${process.env.GITHUB_WORKSPACE}/src/scripts/release/releaseContext.mjs`);
            const { checkRelease } = await import(`${process.env.GITHUB_WORKSPACE}/src/scripts/release/publishRelease.mjs`);
            const release = await getReleaseContext({
              github, ...context.repo, sha: context.sha,
              packageVersion: JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              manifest: JSON.parse(fs.readFileSync(".release-please-manifest.json", "utf8")),
              changelog: fs.readFileSync("src/releases/CHANGELOG.md", "utf8"),
            });
            if (release) {
              await checkRelease({ github, ...context.repo, release });
            }
            core.setOutput("release", JSON.stringify(release));
            core.setOutput("version", release?.version ?? "");

  docker:
    name: Publish checked image
    needs: [release-context]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/docker.yml
    with:
      sha: ${{ github.sha }}
      release-version: ${{ needs.release-context.outputs.version }}
    secrets:
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

  publish-release:
    name: Publish GitHub Release
    needs: [release-context, docker]
    if: needs.release-context.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/github-script@v8
        env:
          RELEASE_JSON: ${{ needs.release-context.outputs.release }}
        with:
          script: |
            const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/src/scripts/release/publishRelease.mjs`);
            await publishRelease({ github, ...context.repo, release: JSON.parse(process.env.RELEASE_JSON) });

  release-pr:
    name: Prepare release PR
    needs: [docker, publish-release]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.docker.result == 'success' &&
      (needs.publish-release.result == 'success' || needs.publish-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
